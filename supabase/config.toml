project_id = "prospector"

# La inferencia del producto exige usuario: escribe en la campaña de un tenant.
[functions.infer-segments]
verify_jwt = true

# El escaparate público no tiene usuarios. Lo que lo protege no es el JWT,
# sino la cuota por IP y el tope diario de 002_descubrimiento_y_demo.sql.
[functions.demo-inferir]
verify_jwt = false

# La despierta pg_cron, no una persona. Se autentica con WORKER_SECRETO.
[functions.descubrir]
verify_jwt = false

# El worker de enriquecimiento. Como descubrir: lo despierta el cron, no una
# persona, y lo autentica WORKER_SECRETO.
[functions.enriquecer]
verify_jwt = false

# La página de baja. Pública por definición: quien la abre no es usuario
# nuestro. Lo que la protege es que el token del enlace no se adivina.
[functions.baja]
verify_jwt = false

# El redactor. Como los otros workers: lo despierta el cron y lo autentica
# WORKER_SECRETO.
[functions.redactar]
verify_jwt = false

# Genera el texto de la landing. Escribe en la campaña de un tenant, así que
# exige usuario.
[functions.generar-landing]
verify_jwt = true

# La landing pública. La abre cualquiera que reciba el enlace.
[functions.landing]
verify_jwt = false

# Lee el texto de un PDF de oferta. Escribe en el recurso de un tenant, así
# que exige usuario.
[functions.leer-documento]
verify_jwt = true

# El correo de prueba va SIEMPRE a la dirección de quien lo pide, y esa
# dirección sale del token. Sin JWT no habría a quién enviarlo, así que aquí
# el verify_jwt no es una precaución: es de dónde se saca el destinatario.
[functions.enviar-prueba]
verify_jwt = true

# Lo llama el proveedor de correo, no una persona: sin JWT. Lo que lo
# protege es la firma Svix del cuerpo, verificada dentro. Si falta el
# secreto, la función rechaza todo con 503 en vez de aceptar a ciegas.
[functions.correo-webhook]
verify_jwt = false

# El alta del dominio de un cliente en el proveedor. Con JWT: la lanza el
# cliente desde su Cuenta, y su configuración se lee con SU token para que
# la RLS decida cuál es la suya. La clave del proveedor y las columnas de
# verificación las toca después con service_role, dentro.
[functions.dominio-correo]
verify_jwt = true

# El texto de las campañas del studio. Va con JWT: la escribe el
# cliente desde su sesión y el gasto se imputa a su cuenta.
[functions.componer-campana]
verify_jwt = true
