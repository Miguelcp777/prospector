# La app real. A diferencia de demo/, esta sí tiene build.
#
# Si conectas el repositorio a Netlify, pon `frontend` como base directory
# y estas dos claves de entorno en la configuración del sitio:
#
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_PUBLISHABLE_KEY
#
# Las dos son públicas: acaban dentro del bundle. Lo que protege los datos
# son las políticas RLS, no ellas. SUPABASE_SERVICE_ROLE_KEY no va aquí ni
# en ningún sitio que llegue al navegador.

[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Los assets del bundle llevan hash en el nombre, así que se pueden cachear
# para siempre: al cambiar el contenido cambia la URL.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Las imágenes del catálogo del studio NO llevan hash: el nombre es fijo y el
# código las pide por él. Un año de caché inmutable sobre un nombre estable
# significa que sustituir una foto no llegaría a quien ya la tiene. Una semana
# con revalidación es suficiente para lo que son —fotos de catálogo que casi
# nunca cambian— y deja la puerta abierta a cambiarlas.
[[headers]]
  for = "/imagenes/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

# index.html no: es quien apunta a los assets nuevos tras cada despliegue.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
